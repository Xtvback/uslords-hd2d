<!doctype html><html lang="pt"><meta charset="utf-8"><title>USLORDS — Speranzu</title><style>body{margin:0;background:#121a23;color:#f8dfa5;font-family:Georgia}canvas{display:block}aside{position:fixed;top:20px;left:20px;background:#101722df;padding:16px;border:1px solid #b98a4a}h1{margin:0}</style><canvas id="c"></canvas><aside><h1>USLORDS</h1><p>Speranzu — protótipo inicial</p><p>WASD / setas: mover · Shift: correr · Espaço: explosão · E: falar</p></aside><script>let c=document.querySelector('canvas'),g=c.getContext('2d'),p={x:0,y:0},keys={},t=0,blast=0,walk=0,message='',messageUntil=0;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')blast=1;if(e.key.toLowerCase()==='e'){message=Math.hypot(p.x-2,p.y+1)<2.5?'Aeris: TNT! Os colares começaram a despertar...':Math.hypot(p.x+3,p.y-2)<2.5?'Mask: Cuidado com os guardas do portão norte.':'Aproxima-te de Aeris ou Mask para conversar.';messageUntil=performance.now()+3500}};onkeyup=e=>keys[e.key.toLowerCase()]=false;function iso(x,y,z=0){return [innerWidth/2+(x-y-p.x+p.y)*40,innerHeight/2+(x+y-p.x-p.y)*21-z*40]}function poly(a,color){g.fillStyle=color;g.beginPath();g.moveTo(...a[0]);a.slice(1).forEach(v=>g.lineTo(...v));g.closePath();g.fill()}function building(x,y){let a=iso(x,y),b=iso(x+2,y),d=iso(x,y+2),e=iso(x+2,y+2),u=iso(x,y,2),v=iso(x+2,y,2),w=iso(x+2,y+2,2),q=iso(x,y+2,2);poly([a,b,v,u],'#8f8071');poly([b,e,w,v],'#64584f');poly([u,v,w,q],'#9d4d42');let window=iso(x+1,y,1);g.fillStyle='#ffc56a';g.fillRect(window[0]-5,window[1]-8,10,14)}function actor(x,y,color,label){let a=iso(x,y);g.fillStyle='#0008';g.beginPath();g.ellipse(a[0],a[1],15,6,0,0,7);g.fill();g.fillStyle=color;g.fillRect(a[0]-13,a[1]-42,26,35);g.fillStyle='#d5a36a';g.fillRect(a[0]-16,a[1]-72,32,30);g.fillStyle='#17120f';g.fillRect(a[0]-9,a[1]-60,5,6);g.fillRect(a[0]+5,a[1]-60,5,6);g.font='10px sans-serif';g.fillText(label,a[0]-11,a[1]-77)}function frame(){c.width=innerWidth;c.height=innerHeight;g.fillStyle='#314354';g.fillRect(0,0,c.width,c.height);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let len=Math.hypot(dx,dy)||1;let speed=keys.shift?.16:.09;p.x=Math.max(-11,Math.min(11,p.x+dx/len*speed));p.y=Math.max(-11,Math.min(11,p.y+dy/len*speed));if(dx||dy)walk+=speed*3;t+=.016;for(let x=-12;x<12;x++)for(let y=-12;y<12;y++){let a=iso(x,y),b=iso(x+1,y),d=iso(x,y+1),e=iso(x+1,y+1);poly([a,b,e,d],Math.abs(x)<3||Math.abs(y)<3?(x+y)%2?'#938b7a':'#a89c87':'#59734e')}for(let x=-10;x<=10;x+=4)for(let y=-10;y<=10;y+=4)if(Math.abs(x)>3&&Math.abs(y)>3)building(x,y);actor(2,-1,'#b57bbf','Aeris');actor(-3,2,'#32353a','Mask');actor(p.x,p.y,'#b8322c','TNT');{let a=iso(p.x,p.y);g.fillStyle='#e6ae63';g.fillRect(a[0]-3,a[1]-84,6,12);g.fillStyle='#ffad37';g.beginPath();g.arc(a[0],a[1]-86,3+Math.sin(t*16)*2,0,7);g.fill();g.fillStyle='#243044';let step=Math.sin(walk*7)*4;g.fillRect(a[0]-11,a[1]-7+step,9,7);g.fillRect(a[0]+2,a[1]-7-step,9,7)}if(blast>0){let a=iso(p.x,p.y);g.strokeStyle='rgba(255,165,40,'+blast+')';g.lineWidth=10;g.beginPath();g.ellipse(a[0],a[1]-30,(1-blast)*160,(1-blast)*80,0,0,7);g.stroke();blast-=.025}if(performance.now()<messageUntil){g.fillStyle='#101722eb';g.fillRect(innerWidth/2-260,innerHeight-110,520,65);g.strokeStyle='#d9a55f';g.strokeRect(innerWidth/2-260,innerHeight-110,520,65);g.fillStyle='#ffe8c1';g.font='16px Georgia';g.textAlign='center';g.fillText(message,innerWidth/2,innerHeight-70);g.textAlign='start'}requestAnimationFrame(frame)}frame()</script></html>
