<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>USLORDS 2.0 · O Despertar dos Colares</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111925;color:#f6e8cc;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:12px;left:12px;max-width:min(390px,calc(100vw - 24px));padding:14px 18px;background:#111923e8;border:1px solid #c59d64;border-radius:10px;box-shadow:0 10px 40px #0007}h1{font:700 25px Georgia;margin:0;color:#f4d09b}small{color:#d0bfa3}#quest{font-size:13px;line-height:1.4;margin:8px 0}#bars{display:flex;gap:10px;font-size:12px}.meter{width:95px;height:9px;background:#322c31;border:1px solid #987c68;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:#d45750;width:100%}#mp i{background:#65b8d8}#dialog{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);width:min(680px,92vw);padding:17px 22px;background:#111923ed;border:1px solid #dfad68;border-radius:8px;text-align:center;display:none;box-shadow:0 8px 35px #0008}#controls{position:fixed;right:14px;bottom:14px;font-size:12px;color:#fff9;text-shadow:0 2px 3px #000}#touch{position:fixed;bottom:18px;left:12px;display:none;gap:7px;align-items:end}button{border:1px solid #c79e65;border-radius:9px;background:#1a2734df;color:#fff;padding:12px;touch-action:none}#touch .pad{display:grid;grid-template-columns:repeat(3,42px);gap:3px}#touch .actions{display:flex;gap:5px}#touch .pad button{height:42px;padding:0}@media(pointer:coarse){#touch{display:flex}#controls{display:none}#dialog{bottom:145px}}#version{position:fixed;right:12px;top:12px;background:#15212bd9;padding:7px 10px;border:1px solid #ae8659;border-radius:6px;font-size:12px}</style></head>
<body><canvas id="game"></canvas><section id="hud"><h1>USLORDS</h1><small>O Despertar dos Colares · Speranzu</small><p id="quest">Objetivo: encontra Aeris na praça e fala com ela [E].</p><div id="bars"><span>PV <span id="hp">120</span><div class="meter"><i id="health"></i></div></span><span>Energia <span id="energy">100</span><div class="meter" id="mp"><i id="mana"></i></div></span><span>Colares: <b id="collected">0</b>/3</span></div></section><div id="version">DEMO 2.0</div><div id="dialog"></div><div id="controls">WASD / setas mover · Shift correr · E falar · Espaço detonar · R reiniciar</div><div id="touch"><div class="pad"><span></span><button data-key="arrowup">▲</button><span></span><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><div class="actions"><button data-key="interact">Falar</button><button data-key="attack">💥</button><button data-key="shift">Correr</button></div></div>
<script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),keys=new Set(),P={x:0,y:2,hp:120,mp:100,walk:0,dir:0},A={x:2,y:-1},M={x:-4,y:1},enemies=[{x:6,y:3,hp:3,phase:0},{x:-7,y:-4,hp:3,phase:2},{x:7,y:-6,hp:3,phase:4}],relics=[{x:6,y:3},{x:-7,y:-4},{x:7,y:-6}];let stage=0,won=false,t=0,last=performance.now(),blast=0,particles=[],messageUntil=0,shake=0;let W=0,H=0,S=55;const $=id=>document.getElementById(id);function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*d);c.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);S=Math.min(62,Math.max(36,Math.min(W/18,H/12)))}addEventListener('resize',resize);resize();
function say(msg,secs=4){$('dialog').textContent=msg;$('dialog').style.display='block';messageUntil=t+secs}function updateHud(){$('hp').textContent=Math.ceil(P.hp);$('energy').textContent=Math.floor(P.mp);$('health').style.width=P.hp/120*100+'%';$('mana').style.width=P.mp+'%';$('collected').textContent=relics.filter(r=>r.taken).length}
function reset(){P.x=0;P.y=2;P.hp=120;P.mp=100;stage=0;won=false;enemies.forEach(e=>e.hp=3);relics.forEach(r=>r.taken=false);$('quest').textContent='Objetivo: encontra Aeris na praça e fala com ela [E].';say('Uma nova aventura começa em Speranzu.');updateHud()}
function interact(){if(Math.hypot(P.x-A.x,P.y-A.y)<2.3){if(stage===0){stage=1;$('quest').textContent='Missão: derrota 3 sentinelas e recolhe os colares luminosos.';say('Aeris: TNT, três colares estão nas mãos das sentinelas. Recupera-os!')}else if(stage===2){stage=3;won=true;$('quest').textContent='Missão concluída! Os três colares foram recuperados.';say('Aeris: Conseguimos! Este é apenas o início do despertar...',7)}else say('Aeris: Os colares estão espalhados pelas ruas. Tem cuidado!')}else if(Math.hypot(P.x-M.x,P.y-M.y)<2.3)say('Mask: Ouvi os guardas. Estão a patrulhar os bairros exteriores.');else say('Aproxima-te de Aeris ou Mask para conversar.')}
function attack(){if(P.mp<25){say('Energia insuficiente para detonar.',1.5);return}P.mp-=25;blast=.55;shake=9;for(let i=0;i<48;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*180;particles.push({x:P.x,y:P.y,z:0,vx:Math.cos(a)*v/S,vy:Math.sin(a)*v/S,vz:Math.random()*2.8,life:.4+Math.random()*.6})}enemies.forEach(e=>{if(e.hp>0&&Math.hypot(e.x-P.x,e.y-P.y)<2.65){e.hp--;if(e.hp===0)say('Sentinela derrotada! Procura o colar no chão.',2.5)}});updateHud()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='e')interact();if(k===' ')attack();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='attack')attack();else if(k==='interact')interact();else keys.add(k)});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys.delete(k))});
function pos(x,y,z=0){return [W/2+(x-y-P.x+P.y)*S*.86,H*.52+(x+y-P.x-P.y)*S*.45-z*S]}function polygon(points,color,stroke){g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill()}
function house(x,y,w=2.5,h=2.3,z=2){const a=pos(x,y),b=pos(x+w,y),d=pos(x,y+h),e=pos(x+w,y+h),u=pos(x,y,z),v=pos(x+w,y,z),q=pos(x,y+h,z),r=pos(x+w,y+h,z);polygon([a,b,v,u],'#a49682');polygon([b,e,r,v],'#625d58');polygon([d,e,r,q],'#7d7062');polygon([u,v,r,q],((x+y)%3===0)?'#607387':'#a34f46','#c78b67');for(let k=0;k<2;k++){let p=pos(x+.5+k*.9,y,z*.48);rect(p[0]-5,p[1]-9,10,13,'#f2c778');rect(p[0]-3,p[1]-7,6,9,'#9c6c3d')}let door=pos(x+w,y+h*.6);rect(door[0]-6,door[1]-25,12,25,'#312b2a')}
function tree(x,y){let a=pos(x,y);rect(a[0]-4,a[1]-54,8,55,'#594437');for(let k=0;k<4;k++)ellipse(a[0]+Math.sin(k*2.7)*10,a[1]-57-k*8,24-k*2,18,'#'+['365c47','3c7351','477a55','63845d'][k])}
function character(x,y,kind,moving=0,dir=0){let a=pos(x,y);ellipse(a[0],a[1],19,8,'#121b2188');let step=Math.sin(moving*11)*5;const body=kind==='tnt'?'#bd4236':kind==='aeris'?'#ae82d0':kind==='mask'?'#353540':'#566578';rect(a[0]-12,a[1]-23+step,10,22,kind==='mask'?'#bc9577':'#303746');rect(a[0]+2,a[1]-23-step,10,22,kind==='mask'?'#bc9577':'#303746');if(kind==='aeris')polygon([[a[0]-13,a[1]-49],[a[0]+13,a[1]-49],[a[0]+23,a[1]-19],[a[0]-23,a[1]-19]],body);else rect(a[0]-15,a[1]-55,30,36,body);rect(a[0]-21,a[1]-52+step/2,7,25,body);rect(a[0]+14,a[1]-52-step/2,7,25,body);if(kind==='tnt'){rect(a[0]-21,a[1]-97,42,43,'#b45336');rect(a[0]-17,a[1]-93,34,35,'#d7a46c');rect(a[0]-10,a[1]-77,7,9,'#2b2624');rect(a[0]+4,a[1]-77,7,9,'#2b2624');g.font='bold 10px sans-serif';g.textAlign='center';g.fillStyle='#5b2823';g.fillText('TNT',a[0],a[1]-84);rect(a[0]-2,a[1]-108,4,13,'#4c3c32');ellipse(a[0],a[1]-110,4+Math.sin(t*15)*1.6,5,'#ffbd4e')}else{ellipse(a[0],a[1]-72,17,19,'#d9ad8a');rect(a[0]-18,a[1]-92,36,14,kind==='aeris'?'#785237':'#1d1b26');if(kind==='aeris')ellipse(a[0]+14,a[1]-90,7,7,'#e4b0db');if(kind==='mask')rect(a[0]-17,a[1]-76,34,9,'#1c1c23')}if(kind==='enemy'){rect(a[0]-16,a[1]-74,32,11,'#7e8b8c');rect(a[0]-5,a[1]-73,10,6,'#d94f3e')}}
function scenery(){const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#425e72');grad.addColorStop(.55,'#d0ac84');grad.addColorStop(1,'#233b3e');rect(0,0,W,H,grad);polygon([pos(-19,-19),pos(19,-19),pos(19,19),pos(-19,19)],'#63764d');for(let x=-15;x<=15;x++)for(let y=-15;y<=15;y++){let a=pos(x,y),b=pos(x+1,y),d=pos(x,y+1),e=pos(x+1,y+1);if(a[0]<-150||a[0]>W+150||a[1]<-150||a[1]>H+150)continue;let road=Math.abs(x)<3||Math.abs(y)<3;polygon([a,b,e,d],road?((x+y)%3===0?'#a99b85':'#968b78'):((x+y)%4===0?'#698052':'#72865b'),'#ffffff0b')}}
function fountain(){let a=pos(0,-2);ellipse(a[0],a[1],47,22,'#c5bba8');ellipse(a[0],a[1]-4,39,16,'#5d9aa8');rect(a[0]-12,a[1]-43,24,37,'#d2c7b2');ellipse(a[0],a[1]-45,13,7,'#a4e0e7');for(let i=0;i<3;i++){let x=a[0]+Math.sin(t*2+i*2)*17,y=a[1]-48-Math.abs(Math.sin(t*3+i))*15;ellipse(x,y,2,4,'#c6f4f8')}}
function draw(){g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);scenery();let objects=[];for(let x=-12;x<=12;x+=4)for(let y=-12;y<=12;y+=4){if(Math.abs(x)<4||Math.abs(y)<4)continue;objects.push({depth:x+y,render:()=>house(x,y,2.4,2.3,1.7+Math.abs(x+y)%3*.3)})}for(let i=0;i<24;i++){let x=Math.sin(i*12.43)*13,y=Math.cos(i*9.17)*13;if(Math.abs(x)<4||Math.abs(y)<4)objects.push({depth:x+y,render:()=>tree(x,y)})}objects.push({depth:-2,render:fountain},{depth:A.x+A.y,render:()=>character(A.x,A.y,'aeris',t*.12)},{depth:M.x+M.y,render:()=>character(M.x,M.y,'mask',t*.1)});for(let e of enemies)if(e.hp>0)objects.push({depth:e.x+e.y,render:()=>character(e.x,e.y,'enemy',t*.25)});for(let r of relics)if(!r.taken&&enemies[relics.indexOf(r)].hp<=0)objects.push({depth:r.x+r.y,render:()=>{let a=pos(r.x,r.y,.45+Math.sin(t*3)*.15);ellipse(a[0],a[1],13,7,'#f1c95866');polygon([[a[0],a[1]-15],[a[0]+9,a[1]],[a[0],a[1]+9],[a[0]-9,a[1]]],'#8fe7dd','#fff5b6')}});objects.push({depth:P.x+P.y,render:()=>character(P.x,P.y,'tnt',P.walk,P.dir)});objects.sort((a,b)=>a.depth-b.depth);for(let o of objects)o.render();if(blast>0){let a=pos(P.x,P.y);g.beginPath();g.ellipse(a[0],a[1]-24,(.55-blast)*S*7,(.55-blast)*S*3.5,0,0,Math.PI*2);g.lineWidth=9;g.strokeStyle='rgba(255,165,55,'+blast*1.7+')';g.stroke()}for(let p of particles){let a=pos(p.x,p.y,p.z);ellipse(a[0],a[1],Math.max(1,p.life*5),Math.max(1,p.life*5),p.life>.4?'#ffca65':'#b94d30')}let vign=g.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,Math.max(W,H)*.65);vign.addColorStop(0,'#0000');vign.addColorStop(1,'#0509109c');rect(0,0,W,H,vign);g.restore()}
function tick(now){let dt=Math.min(.045,(now-last)/1000);last=now;t+=dt;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup')),m=Math.hypot(dx,dy);if(m){let speed=keys.has('shift')?4.3:2.6;P.x=Math.max(-13,Math.min(13,P.x+dx/m*speed*dt));P.y=Math.max(-13,Math.min(13,P.y+dy/m*speed*dt));P.walk+=dt*(keys.has('shift')?2:1.1);P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3)}P.mp=Math.min(100,P.mp+dt*5);if(stage>=1){enemies.forEach(e=>{if(e.hp<=0)return;let d=Math.hypot(P.x-e.x,P.y-e.y);if(d<4&&d>.8){e.x+=(P.x-e.x)/d*dt*.45;e.y+=(P.y-e.y)/d*dt*.45}if(d<.85&&Math.floor(t*2)!==Math.floor((t-dt)*2)){P.hp=Math.max(0,P.hp-4);if(P.hp<=0){say('TNT caiu em combate! Pressiona R para recomeçar.',9);stage=-1}}});relics.forEach((r,i)=>{if(!r.taken&&enemies[i].hp<=0&&Math.hypot(P.x-r.x,P.y-r.y)<.9){r.taken=true;say('Colar recuperado! '+relics.filter(z=>z.taken).length+'/3',2.5);if(relics.every(z=>z.taken)){stage=2;$('quest').textContent='Regressa à fonte e fala com Aeris para concluir a missão.'}}})}blast=Math.max(0,blast-dt);shake=Math.max(0,shake-dt*40);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=5*dt;p.life-=dt}if(t>messageUntil)$('dialog').style.display='none';updateHud();draw();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></body></html>
