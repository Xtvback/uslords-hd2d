<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USLORDS — Jardim de Speranzu</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182a2a;color:#fff1d7;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:16px;left:16px;background:#172c32e9;border:2px solid #e8bf79;border-radius:15px;padding:16px 20px;box-shadow:0 8px 35px #0008;max-width:310px}h1{font:700 27px Georgia;margin:0;color:#ffdb9b}#hud p{font-size:13px;line-height:1.4}#message{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);width:min(640px,90vw);text-align:center;background:#152b33ef;border:2px solid #efc583;border-radius:13px;padding:18px;display:none}#keys{position:fixed;right:16px;bottom:12px;background:#172c32b9;border-radius:9px;padding:10px;font-size:12px}#tag{position:fixed;right:16px;top:16px;background:#243c42d9;border:1px solid #e8bf79;border-radius:8px;padding:8px 12px;font-size:12px}#touch{position:fixed;bottom:12px;left:12px;display:none;gap:12px}button{background:#213f49e8;color:#fff;border:1px solid #f4ca8b;border-radius:8px;padding:12px;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,40px);gap:3px}#pad button{height:40px;padding:0}@media(pointer:coarse){#touch{display:flex}#keys{display:none}#message{bottom:140px}}</style></head><body><canvas id="world"></canvas><div id="hud"><h1>USLORDS</h1><small>O Despertar dos Colares</small><p id="quest">Fala com Aeris junto à fonte [E].</p><div>❤️ <span id="hp">120</span> &nbsp; ✨ <span id="energy">100</span> &nbsp; 💎 <span id="gems">0</span>/3</div></div><div id="tag">ESTILO ALTERNATIVO · 2D ILUSTRADO</div><div id="message"></div><div id="keys">WASD / setas mover · Shift correr · E falar · Espaço explosão · R reiniciar</div><div id="touch"><div id="pad"><span></span><button data-k="arrowup">▲</button><span></span><button data-k="arrowleft">◀</button><button data-k="arrowdown">▼</button><button data-k="arrowright">▶</button></div><button data-k="talk">Falar</button><button data-k="boom">💥</button></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),keys=new Set(),P={x:0,y:2,hp:120,en:100,dir:1,step:0},A={x:2,y:-1},M={x:-3,y:1},guards=[{x:6,y:3,hp:3},{x:-6,y:-5,hp:3},{x:7,y:-6,hp:3}],gems=guards.map(a=>({x:a.x,y:a.y,got:false}));let W,H,D,t=0,last=performance.now(),phase=0,blast=0,msgEnd=0,particles=[];const imgs={};for(let n of ['tnt','aeris','mask']){let im=new Image();im.src='assets/'+n+'.svg';imgs[n]=im}const rand=(x,y)=>{let z=Math.sin(x*127.1+y*311.7)*43758.5453;return z-Math.floor(z)};function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function xy(x,y){const scale=Math.max(34,Math.min(64,Math.min(W/18,H/12)));return [W/2+(x-P.x)*scale,H/2+(y-P.y)*scale,scale]}function fill(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill()}function polygon(a,color,stroke){g.beginPath();g.moveTo(...a[0]);for(let i=1;i<a.length;i++)g.lineTo(...a[i]);g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}function line(x,y,X,Y,color,width=2){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function tree(x,y,i){let [a,b,s]=xy(x,y);ellipse(a,b+10,s*.37,s*.15,'#162b2688');fill(a-5,b-40,10,46,'#79573d');for(let j=0;j<6;j++){let angle=j*2.4+i,xx=a+Math.sin(angle)*s*.24,yy=b-40+Math.cos(angle)*s*.16;ellipse(xx,yy,s*.32,s*.27,['#3c865e','#57a06b','#69ac70','#2e745a'][j%4])}for(let k=0;k<6;k++)ellipse(a+Math.sin(i*6+k*2)*s*.24,b-48+Math.cos(k*3+i)*s*.22,2,2,'#ffdc9d')}
function house(x,y,i){let [a,b,s]=xy(x,y),w=s*3.1,h=s*2.7;ellipse(a,b+s*.3,w*.53,s*.33,'#16272477');fill(a-w*.46,b-h*.28,w*.92,h*.67,'#e8d2a5');for(let k=0;k<4;k++)fill(a-w*.43+k*w*.23,b-h*.24,w*.02,h*.57,'#c5aa82');polygon([[a-w*.58,b-h*.27],[a,b-h*.89],[a+w*.58,b-h*.27],[a+w*.46,b-h*.13],[a,b-h*.66],[a-w*.46,b-h*.13]],i%2?'#a75246':'#557b83','#6e4c4b');for(let k=0;k<8;k++)line(a-w*.44+k*w*.12,b-h*.26,a-w*.37+k*w*.12,b-h*.45,'#f1ac75',2);fill(a-w*.14,b+h*.08,w*.28,h*.3,'#644d47');fill(a-w*.32,b-h*.04,w*.17,h*.16,'#6d9eaa');fill(a+w*.17,b-h*.04,w*.17,h*.16,'#6d9eaa');for(let k=0;k<5;k++)ellipse(a-w*.38+k*w*.19,b+h*.38,5,4,k%2?'#e7a7a1':'#e5d582')}
function stall(x,y,i){let [a,b,s]=xy(x,y);fill(a-s*.65,b-s*.1,s*1.3,s*.55,'#986e4d');polygon([[a-s*.8,b-s*.65],[a+s*.8,b-s*.65],[a+s*.68,b-s*.2],[a-s*.68,b-s*.2]],i%2?'#edc28c':'#cf7466','#704b43');for(let k=0;k<8;k++)fill(a-s*.75+k*s*.19,b-s*.65,s*.095,s*.43,'#fff0d7');for(let k=0;k<9;k++)ellipse(a-s*.55+(k%5)*s*.26,b+(Math.floor(k/5))*s*.18,4,3,k%2?'#e9ba4d':'#c96753')}
function fountain(){let [a,b,s]=xy(0,-2);ellipse(a,b+s*.13,s*1.05,s*.55,'#6c6861');ellipse(a,b,s*.95,s*.48,'#d5c2a0');ellipse(a,b-s*.06,s*.81,s*.35,'#4c9baa');ellipse(a,b-s*.1,s*.7,s*.25,'#79c6cf');fill(a-s*.12,b-s*.85,s*.24,s*.8,'#c5bca4');ellipse(a,b-s*.82,s*.34,s*.13,'#e7ddc4');for(let j=0;j<7;j++){let u=j*Math.PI*2/7+t;ellipse(a+Math.cos(u)*s*.52,b-s*.22+Math.sin(u)*s*.12,2.5,3.5,'#b9f6ff')}}
function character(x,y,type,walk=0,dir=1){let [a,b,s]=xy(x,y),im=imgs[type];ellipse(a,b+s*.12,s*.25,s*.09,'#12211c77');if(im&&im.complete&&im.naturalWidth){let h=s*1.18,w=h*128/176,bob=walk?Math.abs(Math.sin(walk))*2:Math.sin(t*1.4+x)*.5;g.save();g.translate(a,b-bob);if(type==='tnt'&&dir<0)g.scale(-1,1);g.drawImage(im,-w/2,-h,w,h);g.restore()}else{ellipse(a,b-s*.5,s*.2,s*.25,'#e8b38a');fill(a-s*.15,b-s*.4,s*.3,s*.4,type==='aeris'?'#a782c3':'#a84137')}}
function guard(x,y){let [a,b,s]=xy(x,y);ellipse(a,b+s*.08,s*.26,s*.1,'#0006');fill(a-s*.2,b-s*.58,s*.4,s*.5,'#5e6670');ellipse(a,b-s*.65,s*.22,s*.23,'#87929c');fill(a-s*.14,b-s*.67,s*.28,s*.07,'#a93335');line(a+s*.24,b-s*.4,a+s*.36,b+s*.1,'#d5d8c8',4)}
function scenery(){fill(0,0,W,H,'#547d58');const s=xy(0,0)[2];for(let x=Math.floor(P.x-W/s/2)-2;x<Math.ceil(P.x+W/s/2)+2;x++)for(let y=Math.floor(P.y-H/s/2)-2;y<Math.ceil(P.y+H/s/2)+2;y++){let [a,b]=xy(x,y),r=rand(x,y);fill(a,b,s+1,s+1,r>.5?'#638c61':'#5f885e');if(r>.83)ellipse(a+s*.6,b+s*.4,3,2,'#b9c88a');if(r<.08)ellipse(a+s*.2,b+s*.6,2,2,'#f1c1b3')}for(let x=-15;x<=15;x++)for(let y=-15;y<=15;y++){if(Math.abs(x)>2.5&&Math.abs(y)>2.5)continue;let [a,b]=xy(x,y),r=rand(x,y);fill(a,b,s+1,s+1,r>.5?'#c7b89a':'#bcae92');g.strokeStyle='#8f887744';g.strokeRect(a,b,s,s);if(r>.55)line(a+s*.1,b+s*.68,a+s*.65,b+s*.68,'#e6d8b6',1)}}
function render(){scenery();let list=[];for(let x=-13;x<=13;x+=4)for(let y=-13;y<=13;y+=4){if(Math.abs(x)<4||Math.abs(y)<4)continue;let xx=x,yy=y,i=Math.abs(x*7+y);list.push({y:yy,draw:()=>house(xx,yy,i)})}for(let i=0;i<60;i++){let x=Math.sin(i*12.3)*15,y=Math.cos(i*8.8)*15;if(Math.abs(x)<4||Math.abs(y)<4)list.push({y,draw:()=>tree(x,y,i)})}for(let [x,y,i] of [[-4,-2,0],[-4,2,1],[4,-3,2],[4,3,3]])list.push({y,draw:()=>stall(x,y,i)});list.push({y:-2,draw:fountain},{y:A.y,draw:()=>character(A.x,A.y,'aeris')},{y:M.y,draw:()=>character(M.x,M.y,'mask')});for(let e of guards)if(e.hp>0)list.push({y:e.y,draw:()=>guard(e.x,e.y)});gems.forEach((gem,i)=>{if(guards[i].hp<=0&&!gem.got)list.push({y:gem.y,draw:()=>{let [a,b]=xy(gem.x,gem.y);ellipse(a,b-14+Math.sin(t*4)*4,9,13,'#7fe6e5');ellipse(a,b-15,3,5,'#e7ffff')}})});list.push({y:P.y,draw:()=>character(P.x,P.y,'tnt',P.moving?P.step:0,P.dir)});list.sort((a,b)=>a.y-b.y);for(let o of list)o.draw();for(let i=0;i<25;i++){let [a,b]=xy(Math.sin(i*13.7)*13,Math.cos(i*9.7)*13);ellipse(a+Math.sin(t+i)*8,b+Math.cos(t*2+i)*5,1.7,1.7,'#ffe7a4a0')}for(let p of particles){let [a,b]=xy(p.x,p.y);ellipse(a,b,Math.max(1,p.life*7),Math.max(1,p.life*7),p.life>.3?'#ffd06a':'#e96c42')}if(blast>0){let [a,b,s]=xy(P.x,P.y);g.beginPath();g.arc(a,b,(.5-blast)*s*6,0,7);g.lineWidth=10;g.strokeStyle='rgba(255,181,73,'+blast*1.7+')';g.stroke()}const gr=g.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,Math.max(W,H)*.8);gr.addColorStop(0,'#0000');gr.addColorStop(1,'#10222c88');fill(0,0,W,H,gr)}
function say(v){document.getElementById('message').textContent=v;document.getElementById('message').style.display='block';msgEnd=t+4}function hud(){document.getElementById('hp').textContent=P.hp;document.getElementById('energy').textContent=Math.floor(P.en);document.getElementById('gems').textContent=gems.filter(x=>x.got).length}function interact(){if(Math.hypot(P.x-A.x,P.y-A.y)<1.8){if(phase===0){phase=1;say('Aeris: TNT, recupera os três colares guardados pelas sentinelas!');document.getElementById('quest').textContent='Derrota as sentinelas e recolhe os três colares.'}else if(phase===2){phase=3;say('Aeris: Conseguimos! Speranzu está a salvo, por agora.');document.getElementById('quest').textContent='Missão concluída!'}else say('Aeris: Procura os colares nos bairros exteriores.')}else if(Math.hypot(P.x-M.x,P.y-M.y)<1.8)say('Mask: Os Juízes estão a vigiar o portão norte.');else say('Aproxima-te de Aeris ou Mask.')}function attack(){if(P.en<25){say('Energia insuficiente.');return}P.en-=25;blast=.5;for(let i=0;i<36;i++){let a=Math.random()*7;particles.push({x:P.x,y:P.y,vx:Math.cos(a)*(1+Math.random()*3),vy:Math.sin(a)*(1+Math.random()*3),life:.4+Math.random()*.5})}guards.forEach(e=>{if(e.hp>0&&Math.hypot(P.x-e.x,P.y-e.y)<2.4){e.hp--;if(e.hp===0)say('Sentinela derrotada! Apanha o colar brilhante.')}})}function reset(){P.x=0;P.y=2;P.hp=120;P.en=100;phase=0;guards.forEach(e=>e.hp=3);gems.forEach(e=>e.got=false);document.getElementById('quest').textContent='Fala com Aeris junto à fonte [E].';say('Bem-vindo à praça de Speranzu.')}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='e')interact();if(k===' ')attack();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='talk')interact();else if(k==='boom')attack();else keys.add(k)});for(let ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let m=Math.hypot(dx,dy);P.moving=!!m;if(m){let v=keys.has('shift')?4.5:2.7;P.x=Math.max(-15,Math.min(15,P.x+dx/m*v*dt));P.y=Math.max(-15,Math.min(15,P.y+dy/m*v*dt));P.step+=dt*(keys.has('shift')?16:10);if(dx)P.dir=dx<0?-1:1}P.en=Math.min(100,P.en+dt*5);if(phase===1){for(let e of guards){if(e.hp<=0)continue;let d=Math.hypot(P.x-e.x,P.y-e.y);if(d<3&&d>.9){e.x+=(P.x-e.x)/d*dt*.3;e.y+=(P.y-e.y)/d*dt*.3}}gems.forEach((gem,i)=>{if(!gem.got&&guards[i].hp<=0&&Math.hypot(P.x-gem.x,P.y-gem.y)<.7){gem.got=true;say('Colar recuperado!');if(gems.every(z=>z.got)){phase=2;document.getElementById('quest').textContent='Regressa à fonte e fala com Aeris.'}}})}blast=Math.max(0,blast-dt);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}if(t>msgEnd)document.getElementById('message').style.display='none';hud();render();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></body></html>
