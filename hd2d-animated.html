<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USLORDS HD-2D — Animação 2.6</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182a36;color:#f9e7c6;font-family:system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:14px;left:14px;background:#141d2adf;border:1px solid #e2b879;padding:15px 18px;border-radius:9px;max-width:340px;box-shadow:0 8px 28px #0009}h1{font:700 26px Georgia;margin:0;color:#f5d99d}#quest{font-size:13px}#talk{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:#15202aef;border:1px solid #e2b879;padding:18px 24px;border-radius:9px;max-width:90vw;min-width:300px;text-align:center;display:none}#help{position:fixed;right:14px;bottom:12px;background:#101c28bd;padding:9px;border-radius:7px;font-size:12px}#tag{position:fixed;top:14px;right:14px;background:#14202bda;padding:8px 11px;border:1px solid #e2b879;border-radius:7px;font-size:12px}#touch{position:fixed;bottom:12px;left:12px;display:none;gap:8px}button{background:#172c3bdc;border:1px solid #d7aa6e;color:white;border-radius:8px;padding:11px;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,40px);gap:3px}#pad button{height:40px;padding:0}@media(pointer:coarse){#touch{display:flex}#help{display:none}#talk{bottom:150px}}</style></head><body><canvas id="c"></canvas><div id="hud"><h1>USLORDS</h1><small>O Despertar dos Colares · Speranzu</small><p id="quest">Encontra Aeris junto à fonte e carrega em E.</p><div>❤️ <b id="hp">120</b> &nbsp; ⚡ <b id="mp">100</b> &nbsp; 💎 <b id="gem">0</b>/3</div></div><div id="tag">HD-2D · ANIMAÇÕES 2.6</div><div id="talk"></div><div id="help">WASD/setas: mover · Shift: correr · E: falar · Espaço: explosão · R: reiniciar</div><div id="touch"><div id="pad"><span></span><button data-key="arrowup">▲</button><span></span><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><button data-key="talk">Falar</button><button data-key="boom">💥</button></div><script>
'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),keys=new Set(),P={x:0,y:2,hp:120,mp:100,dir:1,walk:0},A={x:2,y:-1},M={x:-3,y:1},guards=[{x:6,y:3,hp:3},{x:-6,y:-5,hp:3},{x:7,y:-6,hp:3}],relics=guards.map(v=>({x:v.x,y:v.y,taken:false}));let W,H,S,D,last=performance.now(),time=0,stage=0,blast=0,dialogUntil=0,particles=[],moving=false;const imgs={};for(let name of ['tnt','aeris','mask']){const im=new Image();im.src='assets/'+name+'.svg';imgs[name]=im}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);S=Math.max(36,Math.min(62,W/18,H/11))}addEventListener('resize',resize);resize();const noise=(x,y)=>{let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)};function iso(x,y,z=0){return [W/2+(x-y-P.x+P.y)*S*.85,H*.53+(x+y-P.x-P.y)*S*.43-z*S]}function poly(p,color,stroke){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke()}}function ell(x,y,a,b,color){g.beginPath();g.ellipse(x,y,a,b,0,0,Math.PI*2);g.fillStyle=color;g.fill()}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function house(x,y,i){let h=2.2+(i%3)*.2,w=2.4,d=2.2,a=iso(x,y),b=iso(x+w,y),q=iso(x,y+d),r=iso(x+w,y+d),u=iso(x,y,h),v=iso(x+w,y,h),m=iso(x,y+d,h),n=iso(x+w,y+d,h);poly([a,b,v,u],'#d0ad84');poly([b,r,n,v],'#86705e');poly([q,r,n,m],'#a18c71');poly([u,v,n,m],i%2?'#af594c':'#627f8e','#dfb77d');for(let j=0;j<7;j++){let p=iso(x+w*(j+.5)/7,y,h);g.strokeStyle='#e8a77b';g.lineWidth=2;g.beginPath();g.moveTo(p[0]-7,p[1]-4);g.lineTo(p[0]+4,p[1]+4);g.stroke()}for(let j=0;j<2;j++){let p=iso(x+.45+j*.95,y,h*.5);rect(p[0]-5,p[1]-9,11,14,'#f9ce78');rect(p[0]-3,p[1]-7,7,10,'#765e51')}let door=iso(x+w,y+d*.6);rect(door[0]-7,door[1]-25,14,25,'#5a413b')}
function tree(x,y,i){let p=iso(x,y);rect(p[0]-4,p[1]-48,8,49,'#76513b');for(let j=0;j<7;j++){let a=j*2.4+i;ell(p[0]+Math.sin(a)*19,p[1]-54+Math.cos(a)*9,21,16,['#37734d','#48875b','#60975f','#2f684b'][j%4])}for(let j=0;j<5;j++)ell(p[0]+Math.sin(i+j*3)*20,p[1]-65+Math.cos(i+j*2)*15,2.3,2.3,'#f3d38a')}
function lantern(x,y){let p=iso(x,y);rect(p[0]-3,p[1]-83,6,83,'#3c3738');rect(p[0]-11,p[1]-96,22,22,'#403d40');rect(p[0]-7,p[1]-92,14,15,'#ffcf72');ell(p[0],p[1]-84,23,20,'#ffb84d26')}
function fountain(){let p=iso(0,-2);ell(p[0],p[1],49,24,'#cbbca0');ell(p[0],p[1]-5,40,17,'#6baebb');rect(p[0]-11,p[1]-44,22,40,'#d8c9aa');ell(p[0],p[1]-44,14,8,'#c2e9ee');for(let i=0;i<8;i++){let a=i*.8+time*1.3;ell(p[0]+Math.cos(a)*24,p[1]-15+Math.sin(a)*7,2.3,4,'#e4ffff')}}
const villagers=[{x:-2,y:-4,bx:-2,by:-4,offset:0,kind:'mask'},{x:4,y:4,bx:4,by:4,offset:2,kind:'aeris'}];let aerisWalk=0,maskWalk=0;
function limb(ctx,x,y,angle,length,width,color,edge){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.fillStyle=edge;ctx.fillRect(-width/2-2,-2,width+4,length+4);ctx.fillStyle=color;ctx.fillRect(-width/2,0,width,length);ctx.restore()}
function sprite(x,y,type,active=false,dir=1,cycle=0){let p=iso(x,y),im=imgs[type];let phase=active?cycle:0,step=Math.sin(phase),bob=active?Math.abs(Math.sin(phase))*2.2:Math.sin(time*1.4+x)*.5;
ell(p[0],p[1]+1,active?23:19,7,'#10151c88');g.save();g.translate(Math.round(p[0]),Math.round(p[1]-bob));if(dir===-1)g.scale(-1,1);
const colors=type==='tnt'?{arm:'#b73832',leg:'#2e3645',shoe:'#3c292d',trim:'#e98e64'}:type==='aeris'?{arm:'#bc8bd1',leg:'#81638e',shoe:'#63485f',trim:'#e8c1f1'}:{arm:'#514950',leg:'#7b6458',shoe:'#b78c6c',trim:'#988279'};
let swing=active?step*.32:0;
limb(g,-16,-54,swing,28,9,colors.arm,'#362b35');limb(g,16,-54,-swing,28,9,colors.arm,'#362b35');
limb(g,-10,-28,-swing*.85,26,11,colors.leg,'#282631');limb(g,10,-28,swing*.85,26,11,colors.leg,'#282631');
let lx=-10+Math.sin(-swing*.85)*19,rx=10+Math.sin(swing*.85)*19;
g.fillStyle=colors.shoe;g.fillRect(lx-7,-5,15,8);g.fillRect(rx-7,-5,15,8);
if(im.complete&&im.naturalWidth){
// Draw a consistent upper-body portrait; legs and arms are individually posed every frame.
g.drawImage(im,0,0,128,116,-36,-109,72,65);
if(type==='tnt'){g.fillStyle='#b83d32';g.beginPath();g.moveTo(-17,-48);g.lineTo(17,-48);g.lineTo(20,-24);g.lineTo(-20,-24);g.closePath();g.fill();g.strokeStyle='#f39a6d';g.lineWidth=2;g.stroke();g.fillStyle='#702832';g.fillRect(-7,-43,14,18)}
else if(type==='aeris'){g.fillStyle='#b889d2';g.beginPath();g.moveTo(-16,-48);g.lineTo(16,-48);g.lineTo(22,-20);g.lineTo(-22,-20);g.closePath();g.fill();g.strokeStyle='#e8c4f3';g.lineWidth=2;g.stroke()}
else{g.fillStyle='#45414b';g.fillRect(-17,-48,34,25);g.strokeStyle='#967b6d';g.beginPath();g.moveTo(-12,-44);g.lineTo(12,-27);g.stroke()}
}else{g.fillStyle=colors.arm;g.fillRect(-17,-82,34,53)}
if(type==='tnt'){g.fillStyle='#ffc26a';ell(1,-113+Math.sin(time*14)*2,3.5,5,'#ffbd4c')}
g.restore()}
function guard(e){let p=iso(e.x,e.y);ell(p[0],p[1],18,6,'#0006');rect(p[0]-15,p[1]-55,30,44,'#5b626b');ell(p[0],p[1]-67,17,17,'#8b939a');rect(p[0]-12,p[1]-70,24,6,'#bb4d41')}
function world(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5a7d91');sky.addColorStop(.5,'#d5b58c');sky.addColorStop(1,'#314c49');rect(0,0,W,H,sky);poly([iso(-18,-18),iso(18,-18),iso(18,18),iso(-18,18)],'#668153');for(let x=-16;x<16;x++)for(let y=-16;y<16;y++){let p=iso(x,y),q=iso(x+1,y),r=iso(x+1,y+1),s=iso(x,y+1);if(p[0]<-100||p[0]>W+100||p[1]<-100||p[1]>H+100)continue;let road=Math.abs(x)<3||Math.abs(y)<3,n=noise(x,y);poly([p,q,r,s],road?(n>.5?'#c3b297':'#ad9f87'):(n>.5?'#708e5b':'#668455'),'#ffffff15');if(road&&n>.7){let a=iso(x+.3,y+.3),b=iso(x+.7,y+.3);g.strokeStyle='#e4d1b080';g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}}}
function draw(){world();let objects=[];for(let x=-12;x<=12;x+=4)for(let y=-12;y<=12;y+=4){if(Math.abs(x)<4||Math.abs(y)<4)continue;let i=Math.abs(x*3+y);objects.push({depth:x+y,draw:()=>house(x,y,i)})}for(let i=0;i<38;i++){let x=Math.sin(i*12.3)*13,y=Math.cos(i*8.9)*13;if(Math.abs(x)<4||Math.abs(y)<4)objects.push({depth:x+y,draw:()=>tree(x,y,i)})}for(let [x,y] of [[-3,-3],[3,-3],[-3,3],[3,3]])objects.push({depth:x+y,draw:()=>lantern(x,y)});objects.push({depth:-2,draw:fountain},{depth:A.x+A.y,draw:()=>sprite(A.x,A.y,'aeris',false,1,0)},{depth:M.x+M.y,draw:()=>sprite(M.x,M.y,'mask',false,1,0)});for(let e of guards)if(e.hp>0)objects.push({depth:e.x+e.y,draw:()=>guard(e)});relics.forEach((r,i)=>{if(guards[i].hp<=0&&!r.taken)objects.push({depth:r.x+r.y,draw:()=>{let p=iso(r.x,r.y,.4+Math.sin(time*3)*.13);poly([[p[0],p[1]-14],[p[0]+9,p[1]],[p[0],p[1]+8],[p[0]-9,p[1]]],'#7ae8df','#ffefb3')}})});objects.push({depth:P.x+P.y,draw:()=>sprite(P.x,P.y,'tnt',moving,P.dir,P.walk)});for(let v of villagers)objects.push({depth:v.x+v.y,draw:()=>sprite(v.x,v.y,v.kind,true,Math.sin(time*.6+v.offset)>0?1:-1,time*6+v.offset)});objects.sort((a,b)=>a.depth-b.depth);for(let o of objects)o.draw();for(let i=0;i<30;i++){let x=Math.sin(i*11.4)*12,y=Math.cos(i*8.1)*12,p=iso(x,y,.4+Math.sin(time+i)*.3);ell(p[0],p[1],1.5,1.5,'#fff1b78a')}if(blast>0){let p=iso(P.x,P.y);g.beginPath();g.ellipse(p[0],p[1]-20,(.5-blast)*S*6,(.5-blast)*S*3,0,0,7);g.strokeStyle='rgba(255,171,66,'+(blast*1.8)+')';g.lineWidth=9;g.stroke()}for(let p of particles){let a=iso(p.x,p.y,p.z);ell(a[0],a[1],Math.max(1,p.life*5),Math.max(1,p.life*5),'#ffb755')}let shade=g.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,Math.max(W,H)*.7);shade.addColorStop(0,'#0000');shade.addColorStop(1,'#07121aa5');rect(0,0,W,H,shade)}
function say(s){document.getElementById('talk').textContent=s;document.getElementById('talk').style.display='block';dialogUntil=time+4}function update(){document.getElementById('hp').textContent=P.hp;document.getElementById('mp').textContent=Math.floor(P.mp);document.getElementById('gem').textContent=relics.filter(r=>r.taken).length}function interact(){if(Math.hypot(P.x-A.x,P.y-A.y)<2.2){if(stage===0){stage=1;say('Aeris: TNT, as sentinelas roubaram os três colares!');document.getElementById('quest').textContent='Derrota as sentinelas e recolhe os três colares.'}else if(stage===2){stage=3;say('Aeris: Recuperámos os colares. O despertar começou!');document.getElementById('quest').textContent='Missão concluída!'}else say('Aeris: Procura os colares junto às sentinelas.')}else if(Math.hypot(P.x-M.x,P.y-M.y)<2.2)say('Mask: Os Juízes controlam as ruas exteriores.');else say('Aproxima-te de Aeris ou Mask.')}function attack(){if(P.mp<25){say('Energia insuficiente.');return}P.mp-=25;blast=.5;for(let i=0;i<30;i++){let a=Math.random()*7;particles.push({x:P.x,y:P.y,z:.3,vx:Math.cos(a)*3,vy:Math.sin(a)*3,vz:2+Math.random(),life:.4+Math.random()*.4})}for(let e of guards)if(e.hp>0&&Math.hypot(e.x-P.x,e.y-P.y)<2.5){e.hp--;if(!e.hp)say('Sentinela derrotada! Recolhe o colar.')}}function reset(){P.x=0;P.y=2;P.hp=120;P.mp=100;stage=0;guards.forEach((e,i)=>{e.hp=3;e.x=[6,-6,7][i];e.y=[3,-5,-6][i]});relics.forEach(r=>r.taken=false);document.getElementById('quest').textContent='Encontra Aeris junto à fonte e carrega em E.';say('Bem-vindo a Speranzu!')}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='e')interact();if(k===' ')attack();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='talk')interact();else if(k==='boom')attack();else keys.add(k)});for(let ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;time+=dt;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let m=Math.hypot(dx,dy);moving=!!m;if(m){let v=keys.has('shift')?4.5:2.8,wx=(dx+dy)*Math.SQRT1_2,wy=(dy-dx)*Math.SQRT1_2;P.x=Math.max(-13,Math.min(13,P.x+wx/m*v*dt));P.y=Math.max(-13,Math.min(13,P.y+wy/m*v*dt));P.walk+=dt*(keys.has('shift')?15:10);if(dx)P.dir=dx<0?-1:1}for(let v of villagers){v.x=v.bx+Math.sin(time*.6+v.offset)*1.3;v.y=v.by+Math.cos(time*.6+v.offset)*.5}P.mp=Math.min(100,P.mp+dt*5);if(stage===1){relics.forEach((r,i)=>{if(guards[i].hp===0&&!r.taken&&Math.hypot(P.x-r.x,P.y-r.y)<1){r.taken=true;say('Colar recuperado!');if(relics.every(v=>v.taken)){stage=2;document.getElementById('quest').textContent='Regressa à fonte e fala com Aeris.'}}})}blast=Math.max(0,blast-dt);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=5*dt;p.life-=dt}if(time>dialogUntil)document.getElementById('talk').style.display='none';update();draw();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></body></html>
