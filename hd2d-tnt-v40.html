function say(s){document.getElementById('talk').textContent=s;document.getElementById('talk').style.display='block';dialogUntil=time+4}function update(){document.getElementById('hp').textContent=P.hp;document.getElementById('mp').textContent=Math.floor(P.mp);document.getElementById('gem').textContent=relics.filter(r=>r.taken).length}function interact(){interactionUntil=time+1.1;if(Math.hypot(P.x-A.x,P.y-A.y)<2.2){if(stage===0){stage=1;say('Aeris: TNT, as sentinelas roubaram os três colares!');document.getElementById('quest').textContent='Derrota as sentinelas e recolhe os três colares.'}else if(stage===2){stage=3;say('Aeris: Recuperámos os colares. O despertar começou!');document.getElementById('quest').textContent='Missão concluída!'}else say('Aeris: Procura os colares junto às sentinelas.')}else if(Math.hypot(P.x-M.x,P.y-M.y)<2.2)say('Mask: Os Juízes controlam as ruas exteriores.');else say('Aproxima-te de Aeris ou Mask.')}function attack(){attackUntil=time+.38;if(P.mp<25){say('Energia insuficiente.');return}P.mp-=25;blast=.5;for(let i=0;i<30;i++){let a=Math.random()*7;particles.push({x:P.x,y:P.y,z:.3,vx:Math.cos(a)*3,vy:Math.sin(a)*3,vz:2+Math.random(),life:.4+Math.random()*.4})}for(let e of guards)if(e.hp>0&&Math.hypot(e.x-P.x,e.y-P.y)<2.5){e.hp--;e.hitUntil=time+.22;hitFlashes.push({x:e.x,y:e.y,life:.32});if(!e.hp)say('Sentinela derrotada! Recolhe o colar.')}}function reset(){hitFlashes=[];P.x=0;P.y=2;P.hp=120;P.mp=100;stage=0;guards.forEach((e,i)=>{e.hp=3;e.x=[6,-6,7][i];e.y=[3,-5,-6][i]});relics.forEach(r=>r.taken=false);document.getElementById('quest').textContent='Encontra Aeris junto à fonte e carrega em E.';say('Bem-vindo a Speranzu!')}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='e')interact();if(k===' ')attack();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='talk')interact();else if(k==='boom')attack();else keys.add(k)});for(let ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;time+=dt;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let m=Math.hypot(dx,dy);moving=!!m;runMode=keys.has('shift')&&moving;if(m){let v=keys.has('shift')?4.5:2.8,wx=(dx+dy)*Math.SQRT1_2,wy=(dy-dx)*Math.SQRT1_2;P.x=Math.max(-13,Math.min(13,P.x+wx/m*v*dt));P.y=Math.max(-13,Math.min(13,P.y+wy/m*v*dt));P.walk+=dt*(keys.has('shift')?18:11);if(Math.abs(dx)>=Math.abs(dy)&&dx)facing=dx>0?1:3;else if(dy)facing=dy>0?0:2}for(let v of villagers){v.x=v.bx+Math.sin(time*.6+v.offset)*1.3;v.y=v.by+Math.cos(time*.6+v.offset)*.5}P.mp=Math.min(100,P.mp+dt*5);if(stage===1){relics.forEach((r,i)=>{if(guards[i].hp===0&&!r.taken&&Math.hypot(P.x-r.x,P.y-r.y)<1){r.taken=true;say('Colar recuperado!');if(relics.every(v=>v.taken)){stage=2;document.getElementById('quest').textContent='Regressa à fonte e fala com Aeris.'}}})}blast=Math.max(0,blast-dt);hitFlashes=hitFlashes.filter(h=>(h.life-=dt)>0);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=5*dt;p.life-=dt}if(time>dialogUntil)document.getElementById('talk').style.display='none';update();draw();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></body></html>
